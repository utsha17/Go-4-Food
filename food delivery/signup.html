<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styleL.css" />
  <title>Signup</title>
</head>
<body>
  <div class="form-box login">
    <h2>Signup</h2>
    <button type="submit" class="fbtn">Login with facebook
      
      <span class="icon"><ion-icon name="logo-facebook" style="margin-left: 5px; transform: translateY(1px);"></ion-icon></span>
    </button>
    
    <button type="submit" class="fbtn">Login with google
      <span class="icon"><ion-icon name="logo-google"  style="margin-left: 5px;"></ion-icon></span>
    </button>
    
    <form action="#">
    
      <div class="input-box">
        <span class="icon"><ion-icon name="mail"></ion-icon> </span>
        <input type="email" required />
        <label>Email</label>
      </div>
      <div class="input-box">
        <span class="icon"><ion-icon name="person"></ion-icon> </span>
        <input type="Username" required />
        <label>Username</label>
      </div>
      <div class="input-box">
        <span class="icon"><ion-icon name="lock-closed"></ion-icon> </span>
        <input type="password" required />
        <label>Password</label>
      </div>
      <div class="remember-forgot">
        <label><input type="checkbox" >
          I agree to the terms 
          & conditions and Privacy Policy</label>
      </div>
      <button type="submit" class="fbtn">SignUp</button> 
      <div class="SignUp-login">
        
      <p> Already have an account ?<a href="login.html"
            >Login</a></p>
</div>
</form>
  </div>
</div>


<script src="script.js"></script>
<script
  type="module"
  src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
></script>
<script
  module
  src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
></script>
</body>
</html>
  
</body>
</html>
