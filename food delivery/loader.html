<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Go 4 Food</title>
    <style>
      .preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: var(--white);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000000;
      }

      .preloader img {
        width: 20rem;
        height: 20rem;
      }
      
    </style>
  </head>
  <body>
    <div class="preloader">
      <img src="giphy.gif" alt="" />
    </div>
    <script>
      const preloader = document.querySelector(".preloader");

      window.addEventListener("load", () => {
        setTimeout(() => {
          preloader.style.display = "none";
        }, 2000);
      });
    </script>
  </body>
</html>
