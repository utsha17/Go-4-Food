<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styleL.css" />
    <title>Login</title>
  </head>

  <body>
    <div class="wrapper">
      <span class="icon-close">
        <ion-icon name="close-outline"></ion-icon>
      </span>
      <div class="form-box login">
        <h2>Login</h2>
          <div class="input-box">
            <span class="icon"><ion-icon name="mail"></ion-icon> </span>
            <input type="email" required />
            <label>Email</label>
          </div>
          <div class="input-box">
            <span class="icon"><ion-icon name="lock-closed"></ion-icon> </span>
            <input type="password" required />
            <label>Password</label>
          </div>
          <div class="remember-forgot">
            <label><input type="checkbox" />Remember me</label>
            <a href="#">Forgot Password?</a>
          </div>
          <button type="submit" class="btn-login">Login</button>
          <div class="login-SignUp">
            <p>
              Dont't have an account?<a href="#" class="SignUp-link"
                >SignUp</a
              >
            </p>
          </div>
        </form>
      </div>
      <div class="form-box SignUp">
        <h2>SignUp</h2>
        <button type="submit" class="fbtn">Login with facebook</button>
        <span class="icon"><ion-icon name="logo-facebook"></ion-icon></span>
        <button type="submit" class="fbtn">Login with google</button>
        <span class="icon"><ion-icon name="logo-google"></ion-icon></span>
        <form action="#">
          <div class="input-box">
            <span class="icon"><ion-icon name="person"></ion-icon>
            </ion-icon>
           </span>
            <input type="text" required>
                    <label >Username</label>
                    </div>
                    <div class="input-box">
                        <span class="icon"><ion-icon name="person"></ion-icon>
                         </ion-icon>
                        </span>
          </div>
          <div class="input-box">
            <span class="icon"><ion-icon name="mail"></ion-icon> </span>
            <input type="email" required />
            <label>Email</label>
          </div>
          <div class="input-box">
            <span class="icon"><ion-icon name="lock-closed"></ion-icon> </span>
            <input type="password" required />
            <label>Password</label>
          </div>
          <div class="remember-forgot">
            <label><input type="checkbox" >
                I agree to the terms 
                        & conditions </label>
            <a href="#">Forgot Password?</a>
          </div>
          <button type="submit" class="btn-login">SignUp</button>
          <div class="login-SignUp">
            <p>
             Already have an account?<a href="#" class="login"
                >Login</a></p>
    </div>
    </form>
      </div>
    </div>
    
    
    <script src="script.js"></script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      module
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
